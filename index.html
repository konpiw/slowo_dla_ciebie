<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Słowo dla Ciebie</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #ffffff;
}

body {
    display: flex;
    justify-content: center;
    font-family: Georgia, serif;
}

/* CAŁA KARTKA */
.kartka {
    position: relative;
    width: 100%;
    max-width: 928px;
    line-height: 1;
}

/* TWOJE TŁO */
.tlo {
    display: block;
    width: 100%;
    height: auto;
}

/* OBSZAR, W KTÓRYM POJAWIA SIĘ CYTAT */
.obszar-cytatu {
    position: absolute;

    /* dokładne położenie względem grafiki */
    left: 8%;
    top: 32.3%;

    width: 84%;
    height: 39.5%;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    padding: 5% 6%;

    text-align: center;

    overflow: hidden;
}

/* CYTAT */
#verse {
    width: 100%;
    margin: 0;

    color: #315f8f;

    font-family: Georgia, "Times New Roman", serif;
    font-weight: normal;

    font-size: 34px;
    line-height: 1.35;

    text-align: center;

    overflow-wrap: break-word;
    word-wrap: break-word;
}

/* SIGLUM */
#reference {
    width: 100%;

    margin-top: 18px;

    color: #315f8f;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 21px;
    font-weight: bold;

    text-align: center;

    flex-shrink: 0;
}

/* TELEFON */
@media (max-width: 600px) {

    #verse {
        font-size: 25px;
    }

    #reference {
        font-size: 17px;
        margin-top: 12px;
    }
}

/* MAŁY TELEFON */
@media (max-width: 400px) {

    #verse {
        font-size: 21px;
    }

    #reference {
        font-size: 15px;
    }
}

</style>
</head>

<body>

<div class="kartka">

    <img
        src="tlo.png"
        class="tlo"
        alt="Słowo dla Ciebie"
    >

    <div class="obszar-cytatu">

        <p id="verse"></p>

        <div id="reference"></div>

    </div>

</div>


<script>

/* =========================================================
   42 SŁOWA
   ========================================================= */

const fragmenty = [

{
    tekst: "Znam twoje czyny: trud i twoją wytrwałość.",
    siglum: "Ap 2, 2"
},

{
    tekst: "Ty bowiem utworzyłeś moje nerki, Ty utkałeś mnie w łonie mej matki. Dziękuję Ci, że mnie stworzyłeś tak cudownie, godne podziwu są Twoje dzieła.",
    siglum: "Ps 139, 13-14"
},

{
    tekst: "Ukochałem cię odwieczną miłością, dlatego też zachowałem dla ciebie łaskawość.",
    siglum: "Jr 31, 3"
},

{
    tekst: "Przecież Pan, twój Bóg, który ci błogosławił w pracach twych rąk, opiekuje się twoją wędrówką po tej wielkiej pustyni.",
    siglum: "Pwt 2, 7"
},

{
    tekst: "Czyż ci nie rozkazałem: Bądź mężny i mocny? Nie bój się i nie lękaj, ponieważ z tobą jest Pan, Bóg twój, wszędzie, gdziekolwiek pójdziesz",
    siglum: "Joz 1, 9"
},

{
    tekst: "Uczynię to, o co prosisz, ponieważ jestem ci łaskawy, a znam cię po imieniu",
    siglum: "Wj 33, 17"
},

{
    tekst: "Gdy pójdziesz przez wody, Ja będę z tobą, i gdy przez rzeki, nie zatopią ciebie. Gdy pójdziesz przez ogień, nie spalisz się, i nie strawi cię płomień.",
    siglum: "Iz 43, 2"
},

{
    tekst: "Ponieważ drogi jesteś w moich oczach, nabrałeś wartości i Ja cię miłuję.",
    siglum: "Iz 43, 4"
},

{
    tekst: "Wy zaś jesteście wybranym plemieniem, królewskim kapłaństwem, narodem świętym, ludem Bogu na własność przeznaczonym, abyście ogłaszali dzieła potęgi Tego, który was wezwał z ciemności do przedziwnego swojego światła",
    siglum: "1P 2, 9"
},

{
    tekst: "Jesteśmy bowiem Jego dziełem, stworzeni w Chrystusie Jezusie dla dobrych czynów, które Bóg z góry przygotował, abyśmy je pełnili.",
    siglum: "Ef 2, 10"
},

{
    tekst: "Popatrzcie, jaką miłością obdarzył nas Ojciec: zostaliśmy nazwani dziećmi Bożymi: i rzeczywiście nimi jesteśmy.",
    siglum: "1J 3, 1"
},

{
    tekst: "Czyż może niewiasta zapomnieć o swym niemowlęciu, ta, która kocha syna swego łona? A nawet, gdyby ona zapomniała, Ja nie zapomnę o tobie",
    siglum: "Iz 49, 15"
},

{
    tekst: "Wszystkie troski wasze przerzućcie na Niego, gdyż Jemu zależy na was.",
    siglum: "1P 5, 7"
},

{
    tekst: "Sam bowiem powiedział: Nie opuszczę cię ani pozostawię",
    siglum: "Hbr 13, 5"
},

{
    tekst: "Nie lękaj się, bo cię wykupiłem, wezwałem cię po imieniu; tyś moim!",
    siglum: "Iz 43, 1"
},

{
    tekst: "Jeśli my odmawiamy wierności, On wiary dochowuje, bo nie może się zaprzeć siebie samego.",
    siglum: "2Tm 2, 13"
},

{
    tekst: "Jak jest odległy wschód od zachodu, tak daleko odsuwa od nas nasze występki. Jak się lituje ojciec nad synami, tak Pan się lituje nad tymi, co się Go boją.",
    siglum: "Ps 103, 12-13"
},

{
    tekst: "Ja sam będę pasł moje owce (...). Zagubioną odszukam, zabłąkaną sprowadzę z powrotem, skaleczoną opatrzę, chorą umocnię.",
    siglum: "Ez 34, 15-16"
},

{
    tekst: "Albowiem Syn Człowieczy przyszedł szukać i zbawić to, co zginęło.",
    siglum: "Łk 19, 10"
},

{
    tekst: "Tak też nie jest wolą Ojca waszego, który jest w niebie, żeby zginęło jedno z tych małych.",
    siglum: "Mt 18, 14"
},

{
    tekst: "Nie jest bowiem Bóg niesprawiedliwy, aby zapomniał o czynie waszym i miłości (...)",
    siglum: "Hbr 6, 10"
},

{
    tekst: "Oto wyryłem cię na obu dłoniach",
    siglum: "Iz 49, 16"
},

{
    tekst: "W tym przejawia się miłość, że nie my umiłowaliśmy Boga, ale że On sam nas umiłował.",
    siglum: "1J 4, 10"
},

{
    tekst: "Pan wybrał was i znalazł upodobanie w was (...) ponieważ Pan was umiłował i chce dochować przysięgi danej waszym przodkom.",
    siglum: "Pwt 7, 7-8"
},

{
    tekst: "Pan na nowo będzie się cieszył ze świadczenia ci dobrodziejstw, jak cieszył się wyświadczając je twoim przodkom (...)",
    siglum: "Pwt 30, 9"
},

{
    tekst: "(...) a tego, który do Mnie przychodzi, precz nie odrzucę",
    siglum: "J 6, 37"
},

{
    tekst: "Już was nie nazywam sługami (...), ale nazwałem was przyjaciółmi.",
    siglum: "J 15, 15"
},

{
    tekst: "Bóg zaś okazuje nam swoją miłość [właśnie] przez to, że Chrystus umarł za nas, gdyśmy byli jeszcze grzesznikami.",
    siglum: "Rz 5, 8"
},

{
    tekst: "Nie bój się, mała trzódko, gdyż spodobało się Ojcu waszemu dać wam królestwo.",
    siglum: "Łk 12, 32"
},

{
    tekst: "Ponieważ nie przeznaczył nas Bóg, abyśmy zasłużyli na gniew, ale na osiągnięcie zbawienia przez Pana naszego Jezusa Chrystusa",
    siglum: "1Tes 5, 9"
},

{
    tekst: "Pan jest z tobą (...) dzielny wojowniku!",
    siglum: "Sdz 6, 12"
},

{
    tekst: "Wy jesteście solą dla ziemi.",
    siglum: "Mt 5, 13"
},

{
    tekst: "Wy jesteście światłem świata.",
    siglum: "Mt 5, 14"
},

{
    tekst: "Tak mówi Pan Zastępów, Przesławny (...): Kto was dotyka, dotyka źrenicy mojego oka",
    siglum: "Za 2, 12"
},

{
    tekst: "(...) będę dla nich łaskawy, jak jest litościwy ojciec dla syna, który jest mu posłuszny",
    siglum: "Ml 3, 17"
},

{
    tekst: "Nad wszystkim masz litość, bo wszystko w Twej mocy, i oczy zamykasz na grzechy ludzi, by się nawrócili",
    siglum: "Mdr 10, 23"
},

{
    tekst: "Cieszcie się ze mną, bo znalazłem owcę, która mi zginęła.",
    siglum: "Łk 15, 6"
},

{
    tekst: "A zatem nie jesteś już niewolnikiem, lecz synem. Jeżeli zaś synem, to i dziedzicem z woli Bożej.",
    siglum: "Ga 4, 7"
},

{
    tekst: "Ten, który zapoczątkował w was dobre dzieło, dokończy go do dnia Chrystusa Jezusa",
    siglum: "Flp 1, 6"
},

{
    tekst: "Pan niósł cię, jak niesie ojciec swego syna, całą drogę, którą szliście (...)",
    siglum: "Pwt 1, 31"
},

{
    tekst: "Jeśli będziesz Go szukał, On pozwoli ci siebie znaleźć (...)",
    siglum: "1Krn 28, 9"
},

{
    tekst: "Lecz On zna drogę, którą kroczę (...)",
    siglum: "Hi 23, 10"
}

];


/* =========================================================
   LOSOWANIE BEZ POWTÓREK
   ========================================================= */

let pozostale = JSON.parse(
    localStorage.getItem("pozostaleFragmenty")
);

if (!Array.isArray(pozostale) || pozostale.length === 0) {
    pozostale = fragmenty.map((_, index) => index);
}


/* LOSOWANIE */
const losowyIndex = Math.floor(
    Math.random() * pozostale.length
);

const numer = pozostale[losowyIndex];


/* USUWAMY WYLOSOWANY */
pozostale.splice(losowyIndex, 1);

localStorage.setItem(
    "pozostaleFragmenty",
    JSON.stringify(pozostale)
);


/* WYŚWIETLAMY */
document.getElementById("verse").textContent =
    "„" + fragmenty[numer].tekst + "”";

document.getElementById("reference").textContent =
    fragmenty[numer].siglum;


/* =========================================================
   AUTOMATYCZNE DOPASOWANIE CZCIONKI
   ========================================================= */

function dopasujTekst() {

    const obszar = document.querySelector(".obszar-cytatu");
    const verse = document.getElementById("verse");
    const reference = document.getElementById("reference");

    /*
       Zaczynamy od dużej czcionki.
    */

    let rozmiar = Math.min(
        34,
        Math.max(18, window.innerWidth * 0.037)
    );

    verse.style.fontSize = rozmiar + "px";


    /*
       Jeżeli tekst jest za duży,
       zmniejszamy go po 1 px,
       aż zmieści się w ramce.
    */

    while (
        (
            verse.scrollHeight + reference.offsetHeight + 25
            > obszar.clientHeight
        )
        &&
        rozmiar > 15
    ) {

        rozmiar -= 1;

        verse.style.fontSize =
            rozmiar + "px";
    }
}


/* Czekamy aż obraz się załaduje */
window.addEventListener("load", function() {

    setTimeout(dopasujTekst, 100);

});


/* Dopasowanie również po zmianie wielkości okna */
window.addEventListener("resize", function() {

    dopasujTekst();

});

</script>

</body>
</html>
