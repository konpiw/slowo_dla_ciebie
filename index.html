/* =========================================================

   ========================================================= */

/*
   Zmieniamy numer tylko wtedy, gdy zmieniamy bazę cytatów.
   Dzięki temu użytkownicy, którzy wcześniej korzystali
   z wersji 42 cytatów, dostaną nową pulę 70 cytatów.
*/

const WERSJA_BAZY = 2;

const zapisanaWersja =
    localStorage.getItem("wersjaBazy");


if (zapisanaWersja !== String(WERSJA_BAZY)) {

    localStorage.removeItem("pozostaleFragmenty");

    localStorage.setItem(
        "wersjaBazy",
        String(WERSJA_BAZY)
    );
}


/* =========================================================
   LOSOWANIE BEZ POWTÓREK
   ========================================================= */

let pozostale = JSON.parse(
    localStorage.getItem("pozostaleFragmenty")
);


if (!Array.isArray(pozostale) || pozostale.length === 0) {

    pozostale = fragmenty.map(
        (_, index) => index
    );
}


/* LOSOWANIE */

const losowyIndex = Math.floor(
    Math.random() * pozostale.length
);

const numer = pozostale[losowyIndex];


/* USUWAMY WYLOSOWANY */

pozostale.splice(
    losowyIndex,
    1
);


localStorage.setItem(
    "pozostaleFragmenty",
    JSON.stringify(pozostale)
);


/* =========================================================
   WYŚWIETLANIE
   ========================================================= */

document.getElementById("verse").textContent =
    "„" + fragmenty[numer].tekst + "”";

document.getElementById("reference").textContent =
    fragmenty[numer].siglum;


/* =========================================================
   AUTOMATYCZNE DOPASOWANIE CZCIONKI
   ========================================================= */

function dopasujTekst() {

    const obszar =
        document.querySelector(".obszar-cytatu");

    const verse =
        document.getElementById("verse");

    const reference =
        document.getElementById("reference");


    let rozmiar = Math.min(
        34,
        Math.max(
            18,
            window.innerWidth * 0.037
        )
    );


    verse.style.fontSize =
        rozmiar + "px";


    while (
        (
            verse.scrollHeight +
            reference.offsetHeight +
            25
        ) > obszar.clientHeight
        &&
        rozmiar > 15
    ) {

        rozmiar -= 1;

        verse.style.fontSize =
            rozmiar + "px";
    }
}


/* =========================================================
   START
   ========================================================= */

window.addEventListener(
    "load",
    function() {

        setTimeout(
            dopasujTekst,
            100
        );

    }
);


/* =========================================================
   ZMIANA ROZMIARU OKNA
   ========================================================= */

window.addEventListener(
    "resize",
    function() {

        dopasujTekst();

);
